name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            extra: ""
          - target: aarch64-unknown-linux-musl
            os: ubuntu-latest
            # RUSTFLAGS is ignored by rustc when --target is passed, so the
            # linker rides on the command line.
            extra: "-C linker=aarch64-linux-gnu-gcc -C link-self-contained=yes"
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-pc-windows-msvc
            os: windows-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust target
        run: rustup target add ${{ matrix.target }}
      - name: Install musl tools
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - name: Install aarch64 cross linker
        if: matrix.target == 'aarch64-unknown-linux-musl'
        run: sudo apt-get update && sudo apt-get install -y gcc-aarch64-linux-gnu
      - name: Build
        shell: bash
        run: |
          mkdir dist
          name=rusted-${{ matrix.target }}
          if [ "$RUNNER_OS" = "Windows" ]; then
            name=$name.exe
          fi
          rustc --edition 2021 --crate-name rusted --target ${{ matrix.target }} \
            -C opt-level=3 -C strip=symbols -C codegen-units=16 ${{ matrix.extra }} \
            src/main.rs -o "dist/$name"
      - name: Checksum
        shell: bash
        run: (cd dist && sha256sum * > checksums.sha256)
      - uses: actions/upload-artifact@v7
        with:
          name: bin-${{ matrix.target }}
          path: dist/*

  release:
    name: publish release
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: bin-*
          merge-multiple: true
          path: dist
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes
          gh release upload "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --clobber
