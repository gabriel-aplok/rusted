name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential curl python3
      - name: Install Rust
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain stable
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          "$HOME/.cargo/bin/rustup" component add rustfmt clippy
      - name: Test
        run: ./scripts/test.sh all

  msrv:
    name: msrv 1.85
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential
      - name: Install Rust 1.85
        run: |
          rustup toolchain install 1.85.0 --profile minimal --component clippy
          rustup override set 1.85.0
      - name: Unit suite
        run: ./scripts/test.sh unit
      - name: Build and run bootstrap
        run: |
          mkdir -p target/msrv
          rustc --edition 2021 --crate-name rusted -C opt-level=0 -C debuginfo=0 -C codegen-units=16 src/main.rs -o target/msrv/rusted
          ./target/msrv/rusted new hello
          ./target/msrv/rusted run --manifest-path hello/Cargo.toml

  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Build bootstrap
        run: |
          rustup default stable-msvc
          mkdir target/bootstrap
          rustc --edition 2021 --crate-name rusted -C opt-level=0 -C debuginfo=0 -C strip=debuginfo -C codegen-units=16 src/main.rs -o target/bootstrap/rusted.exe
      - name: Check rustdoc
        run: |
          rustdoc --version
          Get-Command rustdoc | Format-List Source
      - name: Test
        run: |
          mkdir target/tests
          rustc --edition 2021 --test src/main.rs -o target/tests/rusted-unit.exe
          .\target\tests\rusted-unit.exe
      - name: Smoke test
        run: |
          .\target\bootstrap\rusted.exe new hello
          .\target\bootstrap\rusted.exe run --manifest-path hello/Cargo.toml
      - name: Smoke test examples, benches, doc, and target
        run: |
          $env:RUSTED_CACHE_DIR = "$env:RUNNER_TEMP\rusted-cache"
          .\target\bootstrap\rusted.exe run --example adder --manifest-path tests/fixtures/examples-fixture/Cargo.toml
          .\target\bootstrap\rusted.exe test --bench simple --manifest-path tests/fixtures/examples-fixture/Cargo.toml
          .\target\bootstrap\rusted.exe doc --manifest-path tests/fixtures/examples-fixture/Cargo.toml
          .\target\bootstrap\rusted.exe build --target x86_64-pc-windows-msvc --manifest-path tests/fixtures/examples-fixture/Cargo.toml
          Test-Path target/x86_64-pc-windows-msvc/debug

  macos:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Build bootstrap
        run: |
          rustup default stable
          mkdir -p target/bootstrap
          rustc --edition 2021 --crate-name rusted -C opt-level=0 -C debuginfo=0 -C strip=debuginfo -C codegen-units=16 src/main.rs -o target/bootstrap/rusted
      - name: Test
        run: |
          mkdir -p target/tests
          rustc --edition 2021 --test src/main.rs -o target/tests/rusted-unit
          ./target/tests/rusted-unit
      - name: Smoke test
        run: |
          ./target/bootstrap/rusted new hello
          ./target/bootstrap/rusted run --manifest-path hello/Cargo.toml
