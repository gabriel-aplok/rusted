name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-slim
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential curl python3
      - name: Install Rust
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain stable
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          "$HOME/.cargo/bin/rustup" component add rustfmt clippy
      - name: Test
        run: ./scripts/test.sh all

  windows:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Build bootstrap
        run: |
          rustup default stable-msvc
          mkdir target/bootstrap
          rustc --edition 2021 --crate-name rusted -C opt-level=0 -C debuginfo=0 -C strip=debuginfo -C codegen-units=16 src/main.rs -o target/bootstrap/rusted.exe
      - name: Check rustdoc
        run: |
          rustdoc --version
          Get-Command rustdoc | Format-List Source
      - name: Test
        run: |
          mkdir target/tests
          rustc --edition 2021 --test src/main.rs -o target/tests/rusted-unit.exe
          .\target\tests\rusted-unit.exe
      - name: Smoke test
        run: |
          .\target\bootstrap\rusted.exe new hello
          .\target\bootstrap\rusted.exe run --manifest-path hello/Cargo.toml

  macos:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Build bootstrap
        run: |
          rustup default stable
          mkdir -p target/bootstrap
          rustc --edition 2021 --crate-name rusted -C opt-level=0 -C debuginfo=0 -C strip=debuginfo -C codegen-units=16 src/main.rs -o target/bootstrap/rusted
      - name: Test
        run: |
          mkdir -p target/tests
          rustc --edition 2021 --test src/main.rs -o target/tests/rusted-unit
          ./target/tests/rusted-unit
      - name: Smoke test
        run: |
          ./target/bootstrap/rusted new hello
          ./target/bootstrap/rusted run --manifest-path hello/Cargo.toml
